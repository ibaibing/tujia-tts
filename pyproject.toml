[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tujia-tts"
version = "0.3.0"
description = "Tujia text-to-speech: Ye pinyin to 16 kHz waveform (single-speaker, ONNX)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ibaibing" }]
keywords = ["tujia", "low-resource", "text-to-speech", "tts", "vits", "onnx"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: Linguistic",
  "Natural Language :: Chinese (Simplified)",
]
dependencies = [
  "onnxruntime>=1.16",
  "numpy>=1.21",
  "tujia-nlp>=0.3",
]

[project.urls]
Homepage = "https://github.com/ibaibing/tujia-tts"
"Model (Hugging Face)" = "https://huggingface.co/TujiaNLP/tujia-tts-v0.3"
"Model (ModelScope)" = "https://modelscope.cn/models/TujiaNLP/tujia-tts-v0.3"

[project.scripts]
tujia-tts = "tujia_tts.synth:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tujia_tts*"]

[tool.setuptools.package-data]
tujia_tts = ["data/*.onnx", "data/*.json"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]
